    <title>DIY装修</title>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      if(token){
        document.cookie = 'admin_info=' + encodeURIComponent(JSON.stringify({token: token})) + ';path=/';
      }
      // Hook window.close so "保存并关闭" notifies parent to close the modal
      window.close = function(){ window.parent.postMessage('diy-close','*'); };
    })();
  </script>
