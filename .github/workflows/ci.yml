name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: goshop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - name: Go 工具链对齐检查（真值 go.mod）
        run: python3 scripts/sync_go_toolchain.py
      # 与 go.mod、Dockerfile、本步校验、mise、.tool-versions 对齐
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
      - name: Build
        run: go build -o bin/goshop ./cmd/server/
      # 与 scripts/quick_test.sh 一致：排除 web/node_modules 下误入的 Go 包
      - name: Vet
        run: |
          go list ./... | grep -v '/node_modules/' | xargs -r go vet
      - name: Fmt check
        run: |
          OUT=$(find . -name '*.go' \
            -not -path './web/node_modules/*' \
            -not -path './admin/node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 gofmt -s -l)
          test -z "$OUT"
      - name: Unit tests
        env:
          GOSHOP_TEST_MYSQL_DSN: "root:testpass@tcp(127.0.0.1:3306)/goshop_test?parseTime=true&loc=Local&charset=utf8mb4&multiStatements=true"
        run: |
          go list ./... | grep -v '/node_modules/' | xargs -r go test -v -count=1
      - name: Unit tests (race)
        env:
          GOSHOP_TEST_MYSQL_DSN: "root:testpass@tcp(127.0.0.1:3306)/goshop_test?parseTime=true&loc=Local&charset=utf8mb4&multiStatements=true"
        run: |
          go list ./... | grep -v '/node_modules/' | xargs -r go test -count=1 -race -timeout 5m
      - name: Govulncheck
        timeout-minutes: 12
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Integration tests
        env:
          GOSHOP_DB_HOST: 127.0.0.1
          GOSHOP_DB_PORT: 3306
          GOSHOP_DB_USER: root
          GOSHOP_DB_PASS: testpass
          GOSHOP_DB_NAME: goshop_test
        run: |
          cat > config.yaml <<EOF
          server:
            port: 8080
            mode: release
          db:
            host: 127.0.0.1
            port: 3306
            user: root
            password: "testpass"
            dbname: goshop_test
          redis:
            host: ""
          jwt:
            secret: "ci-test-secret-key-at-least-32-chars"
            expire: 72
          payment:
            sandbox: true
          EOF
          ./bin/goshop &
          sleep 10
          GOSHOP_PAYMENT_SANDBOX=1 bash scripts/integration_test.sh
          kill %1 2>/dev/null || true

  shopxo-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone shopxo-uniapp
        run: git clone --depth 1 https://github.com/gongfuxiang/shopxo-uniapp.git /tmp/shopxo-uniapp
      - name: Uni-app 静态路由 ⊆ Go routeMap
        run: python3 scripts/extract_shopxo_uniapp_routes.py /tmp/shopxo-uniapp --fail-on-missing
      - name: Clone ShopXO PHP v6.8.0（官方 app/api/controller 基线）
        run: git clone --depth 1 --branch v6.8.0 https://github.com/gongfuxiang/shopxo.git /tmp/shopxo-php
      - name: 冻结 uni-app 合约 ⊆ PHP API 且 ⊆ Go routeMap
        run: python3 scripts/extract_shopxo_php_api_routes.py /tmp/shopxo-php --fail-uniapp-contract

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd web && npm ci
      - name: Build
        run: cd web && npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd admin && npm ci
      - name: Build
        run: cd admin && npm run build

  admin-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: goshop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - name: Go 工具链对齐检查（真值 go.mod）
        run: python3 scripts/sync_go_toolchain.py
      # 与 go.mod、Dockerfile、本步校验、mise、.tool-versions 对齐
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build API
        run: go build -o bin/goshop ./cmd/server/
      - name: Start API (E2E captcha skip)
        env:
          GOSHOP_E2E: "1"
        run: |
          export GOSHOP_E2E=1
          cat > config.yaml <<'EOF'
          server:
            port: 8080
            mode: release
          db:
            host: 127.0.0.1
            port: 3306
            user: root
            password: "testpass"
            dbname: goshop_test
          redis:
            host: ""
          jwt:
            secret: "ci-test-secret-key-at-least-32-chars"
            expire: 72
          payment:
            sandbox: true
          EOF
          ./bin/goshop &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
      - name: Install admin + Playwright
        run: |
          cd admin
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        env:
          CI: true
        run: cd admin && npm run test:e2e
