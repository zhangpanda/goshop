name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: goshop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: go build -o bin/goshop ./cmd/server/
      - name: Vet
        run: go vet ./...
      - name: Fmt check
        run: test -z "$(gofmt -s -l .)"
      - name: Unit tests
        run: go test ./... -v -count=1
      - name: Integration tests
        env:
          GOSHOP_DB_HOST: 127.0.0.1
          GOSHOP_DB_PORT: 3306
          GOSHOP_DB_USER: root
          GOSHOP_DB_PASS: testpass
          GOSHOP_DB_NAME: goshop_test
        run: |
          cat > config.yaml <<EOF
          server:
            port: 8080
            mode: release
          db:
            host: 127.0.0.1
            port: 3306
            user: root
            password: "testpass"
            dbname: goshop_test
          redis:
            host: ""
          jwt:
            secret: "ci-test-secret-key-at-least-32-chars"
            expire: 72
          payment:
            sandbox: true
          EOF
          ./bin/goshop &
          sleep 3
          GOSHOP_PAYMENT_SANDBOX=1 bash scripts/integration_test.sh || true
          kill %1 2>/dev/null || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd web && npm ci
      - name: Build
        run: cd web && npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd admin && npm ci
      - name: Build
        run: cd admin && npm run build
