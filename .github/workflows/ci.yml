name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: go build -o bin/goshop ./cmd/server/
      - name: Vet
        run: go vet ./...
      - name: Fmt check
        run: test -z "$(gofmt -s -l .)"
      - name: Test
        run: go test ./... -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd web && npm ci
      - name: Build
        run: cd web && npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd admin && npm ci
      - name: Build
        run: cd admin && npm run build
