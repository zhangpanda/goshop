version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: goshop123
      MYSQL_DATABASE: goshop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 后端：Dockerfile 构建；与 go.mod / CI / mise.toml / .tool-versions 对齐
  goshop:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - uploads:/app/uploads
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
